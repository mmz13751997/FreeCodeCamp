<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Photo App</title>
</head>
<body>
    <h1>CatPhotoApp</h1>

    <h3>Cat Photos</h3>

    <p>Everyone loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg">cute cats</a> online!</p>

    <p>See more <a href="https://freecatphotoapp.com/">cat photos</a> in our gallery.</p>

    <img src="./img/relaxing-cat.jpg" alt="a cute cat relaxing">

    <h3>Cat Lists</h3>
    <h2>things cats love: </h2>

    <ul>
        <li>catnip</li>
        <li>laser pointers</li>
        <li>lasagna</li>
    </ul>
    <img src="./img/lasagna.webp" alt="a piece of lasagna">
    <figcaption>Cats <em>love</em> lasagna</figcaption>

    <h3>Top 3 things cats hate: </h3>
    
    <ol>
        <li>flea treatment</li>
        <li>thunder</li>
        <li>other cats</li>
    </ol>
    <img src="./img/cats.jpg" alt="two cats sleeping next to each other">
    <figcaption>Cats <strong>hate</strong> other cats.</figcaption>

    <footer>
        <p>No Copyright - <a href="https://www.freecodecamp.org/">freeCodeCamp.org</a></p>
    </footer>
    
</body>
</html>
