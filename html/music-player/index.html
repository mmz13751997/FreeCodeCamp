<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A plain html music player" />
    <meta property="og:title" content="Music player" />
    <meta property="og:type" content="audio" />

    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>freeCodeCamp Tunes</h1>
    </header>
    <main>
      <div class="music">
        <h2>Can't Stay Down</h2>
        <p>Artist: Quincy Larson</p>
        <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3" loop controls></audio>
      </div>

      <div class="music">
        <h2>Cruising for a Musing</h2>
        <p>Artist: Quincy Larson</p>
        <audio
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3"
          loop
          controls
        ></audio>
      </div>

      <div class="music">
        <h2>Scratching the Surface</h2>
        <p>Artist: Quincy Larson</p>
        <audio
          src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3"
          loop
          controls
        ></audio>
      </div>
    </main>
  </body>
</html>
